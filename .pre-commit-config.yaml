repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        files: \.(py)$

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        files: \.(py)$

      - id: eslint
        name: eslint
        entry: npm run lint --silent
        language: system
        files: \.(js|jsx)$
